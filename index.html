 const map=kind==='weight'?db.weights:db.days;const currentEstimatedMaintenance=kind==='balance'?goalEngine()?.maintenance:null;let raw=Object.entries(map).filter(([date,val])=>date>=start&&date<=end).map(([date,val])=>{let v=kind==='weight'?val:kind==='balance'?(val?.complete&&numeric(val?.calories,500,9000)!==null?Number(val.calories)-currentEstimatedMaintenance:null):val?.[kind];return {date,value:kind==='balance'&&Number.isFinite(v)?v:numeric(v,0,100000)}}).filter(x=>x.value!==null).sort((a,b)=>a.date.localeCompare(b.date));return raw;
}
function chartView(kind){const a=chartData(kind),color=kind==='weight'?'var(--purple)':kind==='steps'?'var(--green)':kind==='balance'?'var(--orange)':'var(--blue)';if(a.length===0)return `<div class="empty" style="height:220px;display:grid;place-items:center">No ${kind} records for this period. Log a check-in to start your chart.</div>`;
 const W=640,H=235,l=15,r=50,t=25,b=35,vals=a.map(x=>x.value),min0=Math.min(...vals),max0=Math.max(...vals),gap=Math.max(1,(max0-min0)*.15);let min=Math.max(0,min0-gap),max=max0+gap;
 if(kind==='weight'){min=Math.max(0,min0-Math.max(.4,gap));max=max0+Math.max(.4,gap)}if(kind==='balance'){min=Math.min(0,min0-gap);max=Math.max(0,max0+gap)}if(max-min<.0001)max=min+1;
 const minDate=a[0].date,maxDate=a.at(-1).date,days=Math.max(1,betweenDays(minDate,maxDate)),x=day=>l+(betweenDays(minDate,day)/days)*(W-l-r),y=val=>t+(max-val)/(max-min)*(H-t-b);
 let grid='';for(let i=0;i<4;i++){let yy=t+i*(H-t-b)/3,v=max-(max-min)*i/3;grid+=`<line class="chart-grid" x1="${l}" x2="${W-r}" y1="${yy}" y2="${yy}"/><text class="chart-axis" x="${W-r+6}" y="${yy+4}">${fmt(v,kind==='weight'?1:0)}</text>`}
 const coords=a.map(o=>[x(o.date),y(o.value)]),poly=coords.map(p=>p.join(',')).join(' ');const area=`${l},${H-b} ${poly} ${x(a.at(-1).date)},${H-b}`;
 const units=kind==='weight'?'kg':kind==='steps'?'steps':kind==='balance'?'kcal vs estimated maintenance':'kcal';
 const selected=pickedChart&&pickedChart.kind===kind?a.find(x=>x.date===pickedChart.date):a.at(-1);
 return `<div class="chart-box"><svg class="interactive-chart" data-chart="${kind}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Interactive ${kind} trend with ${a.length} observations"><g>${grid}</g><polygon points="${area}" fill="${color}" opacity=".12"/><polyline points="${poly}" fill="none" stroke="${color}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>${kind==='balance'&&min<0&&max>0?`<line x1="${l}" x2="${W-r}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)" stroke-dasharray="5 5" stroke-width="1.7"/>`:''}${a.map(o=>`<circle class="chart-point" data-act="chart-point" data-kind="${kind}" data-date="${o.date}" cx="${x(o.date)}" cy="${y(o.value)}" r="${selected?.date===o.date?8:6}" fill="${color}"><title>${o.date}: ${fmt(o.value,kind==='weight'?1:0)} ${units}</title></circle>`).join('')}<text class="chart-axis" x="${l}" y="${H-5}">${minDate.slice(5)}</text><text class="chart-axis" x="${W-r}" text-anchor="end" y="${H-5}">${maxDate.slice(5)}</text></svg></div><div class="chart-selection" id="chart-selected">${selected?`<strong>${selected.date}</strong> · ${fmt(selected.value,kind==='weight'?1:0)} ${units}`:'Tap a data point for details'}</div>`;
}

function handleSubmit(e){const form=e.target;if(!form.matches('#check-form,#food-form,#profile-form,#goal-form,#macros-form'))return;e.preventDefault();const v=Object.fromEntries(new FormData(form).entries());try{
 if(form.id==='check-form'){const date=v.date;if(!validDay(date))throw Error('Choose a valid date up to today.');let cal=parseEntry(v,'calories',0,9000),steps=parseEntry(v,'steps',0,100000),protein=parseEntry(v,'protein',0,900),carbs=parseEntry(v,'carbs',0,1200),fat=parseEntry(v,'fat',0,700),weight=parseEntry(v,'weight',25,300),complete=v.complete==='on';
 if(complete&&(cal===null||cal<500))throw Error('A complete day needs a reasonably comprehensive calorie total (at least 500 kcal).');
 if([cal,steps,protein,carbs,fat,weight].every(x=>x===null))throw Error('Enter at least one daily value.');
 const kcalFromMacros=[protein,carbs,fat].every(x=>x!==null)?protein*4+carbs*4+fat*9:null;
 if(kcalFromMacros!==null&&cal!==null&&Math.abs(kcalFromMacros-cal)/Math.max(1,cal)>.25&&!confirm('Calories differ from macro-derived energy by more than 25%. Save as entered?'))return;
 db.days[date]={calories:cal,steps,protein,carbs,fat,complete,notes:String(v.notes||'').slice(0,500)};
 if(weight!==null)db.weights[date]=weight;
 focusDay=date;closeSheet();commit();notify('Daily record saved.');return;
 }
 if(form.id==='food-form'){const name=String(v.name||'').trim().slice(0,90);if(!name)throw Error('Enter a food name.');let food={id:sheet.id||newID(),name,calories:parseEntry(v,'calories',0,9000),protein:parseEntry(v,'protein',0,900)||0,carbs:parseEntry(v,'carbs',0,1200)||0,fat:parseEntry(v,'fat',0,700)||0,fiber:parseEntry(v,'fiber',0,150)||0,sugar:parseEntry(v,'sugar',0,1200)||0,sodium:parseEntry(v,'sodium',0,20000)||0,favorite:v.favorite==='on'};if(food.calories===null)throw Error('Calories are required.');let fs=db.foods[diaryDay]||[];db.foods[diaryDay]=sheet.id?fs.map(f=>f.id===sheet.id?food:f):[...fs,food];if(food.favorite){db.favorites=[...db.favorites.filter(f=>f.name.toLowerCase()!==food.name.toLowerCase()),food].slice(-150)}closeSheet();commit();notify('Food saved to optional diary.');return;}
 if(form.id==='profile-form'){const age=ageFromDOB(v.dob);if(age===null||age<16||age>100)throw Error('Enter a valid birth date for ages 16–100.');let h=parseEntry(v,'height',110,250),w=parseEntry(v,'weight',25,300),a=parseEntry(v,'activityIndex',0,3);if(h===null||w===null||a===null)throw Error('Height, weight and activity are required.');db.profile={...db.profile,name:String(v.name||'').trim().slice(0,45),dob:v.dob,sex:v.sex,height:h,weight:w,activityIndex:a,weightHistory:v.weightHistory};db.weights[today()]=w;if(age<19)db.goal.mode='maintain';db.plan.approved=null;db.plan.approvedAt='';closeSheet();commit();notify('Profile saved. Starting estimates recalculated.');return;}
 if(form.id==='goal-form'){const young=safeAge(db.profile)<19,mode=young?'maintain':v.mode;if(!['cut','maintain','gain'].includes(mode))throw Error('Choose a goal.');const rate=parseEntry(v,'rate',.1,.5),target=parseEntry(v,'target',25,300),w=presentWeight();if(mode==='cut'&&target>=w)throw Error('Weight-loss target must be below your current weight.');if(mode==='gain'&&target<=w)throw Error('Weight-gain target must be above your current weight.');db.goal={mode,rate:rate||.25,target:target||w,targetDate:v.targetDate||'',startDate:today()};db.plan.approved=null;db.plan.approvedAt='';db.plan.reviewedAt='';closeSheet();commit();notify('Strategy updated. Review new estimate.');return;}
 if(form.id==='macros-form'){const protein=parseEntry(v,'protein',.8,2.4),fat=parseEntry(v,'fat',.5,1.5);if(protein===null||fat===null)throw Error('Enter valid macro factors.');db.profile.proteinFactor=protein;db.profile.fatFactor=fat;closeSheet();commit();notify('Macro targets updated.');return;}
 }catch(err){sheetWarn(err.message||'Please correct the form.')}}
function handleChange(e){const t=e.target;
 if(t.id==='diary-date'&&validDay(t.value)){diaryDay=t.value;render();return}
 if(t.id==='json-import'&&t.files?.[0]){importFile(t.files[0],'json');return}
 if(t.id==='csv-import'&&t.files?.[0]){importFile(t.files[0],'csv');return}
 if(t.matches('[data-wheel-input]')&&draft){let v=numeric(t.value,110,250);if(v!==null){draft[t.dataset.wheelInput]=v;let w=$(`.wheel[data-wheel="${t.dataset.wheelInput}"]`);if(w)w.scrollTo({top:Math.round(v-110)*56,behavior:'instant'});saveDraft()}return}
 if(t.matches('[data-ruler-input]')&&draft){setRuler(t.dataset.rulerInput,t.value,true);return}
 if(t.name==='rate'&&draft){updateFormState(e);return}
}
function handleChartPointer(event){const svg=event.target.closest?.('svg.interactive-chart');if(!svg||event.type==='pointermove'&&event.pointerType==='touch')return;const kind=svg.dataset.chart,series=chartData(kind);if(!series.length)return;const rect=svg.getBoundingClientRect();if(!rect.width)return;const x=clamp((event.clientX-rect.left)/rect.width*640,15,590);const start=series[0].date,last=series.at(-1).date,span=Math.max(1,betweenDays(start,last));let hit=series[0],dist=Infinity;for(const p of series){const xx=15+betweenDays(start,p.date)/span*575,delta=Math.abs(x-xx);if(delta<dist){dist=delta;hit=p}}pickedChart={kind,date:hit.date};const box=$('#chart-selected');if(box)box.innerHTML=`<strong>${hit.date}</strong> · ${fmt(hit.value,kind==='weight'?1:0)} ${kind==='weight'?'kg':kind==='steps'?'steps':kind==='balance'?'kcal vs maintenance':'kcal'}`;svg.querySelectorAll('.chart-point').forEach(el=>el.setAttribute('r',el.dataset.date===hit.date?'8':'6'));}
function handleKey(e){if(e.key==='Escape'&&sheet)closeSheet()}
window.addEventListener('scroll',handleScroll,true);
document.addEventListener('pointerdown',e=>{const r=e.target.closest?.('.ruler-scroller');if(r)r.dataset.locked='false'},{passive:true});
document.addEventListener('touchstart',e=>{const r=e.target.closest?.('.ruler-scroller');if(r)r.dataset.locked='false'},{passive:true});
document.addEventListener('wheel',e=>{const r=e.target.closest?.('.ruler-scroller');if(r)r.dataset.locked='false'},{passive:true});
document.addEventListener('click',handleClick);
document.addEventListener('input',updateFormState);
document.addEventListener('change',handleChange);
document.addEventListener('submit',handleSubmit);
document.addEventListener('keydown',handleKey);
document.addEventListener('pointerdown',handleChartPointer);
document.addEventListener('pointermove',handleChartPointer);
window.matchMedia?.('(prefers-color-scheme: dark)')?.addEventListener?.('change',()=>{if(db.settings.theme==='system')useTheme()});
window.addEventListener('pageshow',()=>{if(!sheet)render()});
if(db.draft&&!db.profile){draft=db.draft;onboarding=clamp(n0(db.draft.step),0,stages.length-1)}
if(db.profile&&safeAge(db.profile)<19){db.goal.mode='maintain';persist()}
render();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
// Diagnostic API is read-only; used for local browser regression tests only.
window.macroDiagnostics=()=>({profile:db.profile?{...db.profile}:null,view,goal:{...db.goal},engine:db.profile?goalEngine():null,days:JSON.parse(JSON.stringify(db.days)),weights:{...db.weights},draft:draft?{...draft}:null});
})();

</script></body></html>
