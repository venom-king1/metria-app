function findFood(text){let str=text.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');let entries=FOODS.flatMap(x=>x[8].map(a=>({item:x,term:a.normalize('NFD').replace(/[\u0300-\u036f]/g,'')}))).sort((a,b)=>b.term.length-a.term.length);return entries.find(x=>str.includes(x.term))?.item||null}
function parseMeal(text){let input=String(text||'').trim();if(!input||input.length>550)throw Error('Describe your meal in up to 550 characters.');let segments=input.split(/\s+(?:and|with|plus|och|med|samt)\s+|,|\+|\n/i).map(x=>x.trim()).filter(Boolean);if(segments.length>12)throw Error('Use up to 12 food items per estimate.');let items=[],unknown=[];for(const part of segments){let m=part.match(/(\d+(?:[.,]\d+)?)\s*(g|grams?|gram|kg|ml|milliliters?|st|pcs?|pieces?)\b/i),item=findFood(part);if(!item){unknown.push(part);continue}if(!m){unknown.push(part+' (missing quantity)');continue}let amount=parseFloat(m[1].replace(',','.'));if(m[2].toLowerCase()==='kg')amount*=1000;if(['st','pc','pcs','piece','pieces'].includes(m[2].toLowerCase())){if(/egg|ägg/.test(part.toLowerCase()))amount*=55;else {unknown.push(part+' (piece weight unspecified)');continue}}if(amount<1||amount>2500){unknown.push(part+' (quantity out of range)');continue}let fac=amount/100;items.push({id:uid(),name:item[0],quantity:amount,calories:Math.round(item[1]*fac),protein:+(item[2]*fac).toFixed(1),carbs:+(item[3]*fac).toFixed(1),fat:+(item[4]*fac).toFixed(1),fiber:+(item[5]*fac).toFixed(1),sugar:+(item[6]*fac).toFixed(1),sodium:Math.round(item[7]*fac),meal:'Lunch',estimated:true});}return {items,unknown}}

es),'kcal · not used for planning')}${metric('target','PROTEIN',rnd(tot.protein)+' <small>g</small>','Optional food subtotal')}${metric('info','FIBER',rnd(tot.fiber)+' <small>g</small>','Sodium '+rnd(tot.sodium)+' mg')}</div><div class="space"></div>${foods.length?`<div class="list">${foods.map(f=>`<div class="listitem"><div class="left"><span class="glyph">${ico('book')}</span><div><strong>${esc(f.name)}</strong><small>${rnd(f.quantity)}g · ${esc(f.meal)}${f.estimated?' · estimate':''}</small></div></div><div class="right"><b>${rnd(f.calories)} kcal</b><button class="btn tiny subtle" aria-label="Edit food" data-food-edit="${esc(f.id)}">${ico('pencil',15)}</button><button class="btn tiny subtle" aria-label="Remove food" data-food-delete="${esc(f.id)}">${ico('trash',15)}</button></div></div>`).join('')}</div>`:`<div class="empty">${ico('book')}<b>No foods saved</b>Use the meal estimator or add a food manually.</div>`}<div class="row wrap"><button class="btn tiny" data-action="favorite-meal">Save as favorite</button><button class="btn tiny" data-action="recipe-save">Save recipe</button><button class="btn tiny" data-modal="library">Favorites & recipes</button></div></div>`)}

function quoteCSV(x){return `"${String(x??'').replace(/"/g,'""')}"`}function download(name,content,mime='application/json'){let blob=new Blob([content],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}function exportJSON(){download(`metria-backup-${localDay()}.json`,JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2));toast('JSON backup downloaded.')}function exportCSV(){let keys=[...new Set([...Object.keys(state.days),...state.weights.map(x=>x.date)])].sort();let header=['date','calories','protein','carbs','fat','steps','complete','weight_kg','notes'];let rows=[header,...keys.map(d=>{let r=state.days[d],w=state.weights.find(x=>x.date===d);return[d,r?.calories??'',r?.protein??'',r?.carbs??'',r?.fat??'',r?.steps??'',r?.complete?'true':'false',w?.kg??'',r?.notes??'']})];download(`metria-history-${localDay()}.csv`,rows.map(a=>a.map(quoteCSV).join(',')).join('\r\n'),'text/csv');toast('CSV history downloaded.')}
function parseCSV(text){const rows=[],line=[];let cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')quoted=false;else cell+=c}else if(c==='"')quoted=true;else if(c===','){line.push(cell);cell=''}else if(c==='\n'){line.push(cell.replace(/\r$/,''));rows.push([...line]);line.length=0;cell=''}else cell+=c}if(cell||line.length){line.push(cell);rows.push([...line])}return rows}
async function importFile(file,kind){
 if(!file)return;
 try{
  if(file.size>4000000)throw Error('File too large (4 MB limit).');
  const content=await file.text();
  if(kind==='json'){
   const incoming=sanitize(JSON.parse(content));
   if(!confirm('Replace current device records with this backup? Export your current data first.'))return;
   state=incoming;state.account='guest';authed=null;
   if(state.status!=='ready'&&state.profile)state.status='ready';
   close();persist();toast('JSON backup restored.');return;
  }
  const rows=parseCSV(content);
  if(rows.length<2||rows.length>3002)throw Error('CSV requires 1–3000 data rows.');
  const header=rows[0].map(v=>v.trim().toLowerCase()),col=name=>header.indexOf(name);
  if(col('date')<0)throw Error('A date column (YYYY-MM-DD) is required.');
  if(!['weight_kg','steps','calories'].some(v=>header.includes(v)))throw Error('Include weight_kg, steps, or calories.');
  const valid=[];let skipped=0;
  for(const row of rows.slice(1)){
   let date=row[col('date')];if(!validDay(date)||date>localDay()){skipped++;continue}
   const getter=(key,min,max)=>{let i=col(key),raw=i<0?'':row[i];if(raw===''||raw===undefined)return null;let n=Number(raw);return Number.isFinite(n)&&n>=min&&n<=max?n:null};
   let kg=getter('weight_kg',35,300),steps=getter('steps',0,100000),calories=getter('calories',0,15000);
   if(kg===null&&steps===null&&calories===null){skipped++;continue}
   valid.push({date,kg,steps,calories,protein:getter('protein',0,1000),carbs:getter('carbs',0,1500),fat:getter('fat',0,1000),complete:col('complete')>=0?String(row[col('complete')]).toLowerCase()==='true':null});
  }
  if(!valid.length)throw Error('No valid entries found.');
  if(!confirm(`Import ${valid.length} date records and update matching fields? ${skipped} rows skipped.`))return;
  let map=new Map(state.weights.map(v=>[v.date,v]));
  for(const v of valid){
   if(v.kg!==null)map.set(v.date,{date:v.date,kg:+v.kg.toFixed(1)});
   if(v.steps!==null||v.calories!==null){
    let old=getDay(v.date),next={...old};
    for(const key of ['steps','calories','protein','carbs','fat','complete'])if(v[key]!==null)next[key]=v[key];
    // Imported calorie totals without an explicit complete=true are NOT automatically eligible for calibration.
    state.days[v.date]=next;
   }
  }
  state.weights=[...map.values()].sort((a,b)=>a.date.localeCompare(b.date));
  close();persist();toast(`${valid.length} CSV dates imported.`);
 }catch(e){toast('Import failed: '+e.message)}
}
function migrateOld(){try{let raw=JSON.parse(localStorage.getItem(OLD)||'null');if(!raw||raw.mode!=='personal'||!raw.profile||!raw.logs||!Array.isArray(raw.weights))throw Error('No compatible personal data found.');if(!confirm('Import your previous Metria logs and profile? Current new-version records will be replaced. Your old data stays untouched.'))return;let s=clean(),p=raw.profile;s.profile={name:String(p.name||'You'),age:safe(p.age,18,100,25),height:safe(p.height,120,230,175),weight:safe(p.weight,35,300,70),sex:['male','female'].includes(p.sex)?p.sex:'unspecified',activity:['sedentary','light','moderate','active','very'].includes(p.activity)?p.activity:'moderate',goal:['maintain','cut','gain'].includes(p.goal)?p.goal:'maintain',rate:p.pace==='steady'?.4:.25,targetWeight:null,targetDate:'',manual:p.manualMaintenance??null,protein:safe(p.proteinFactor,1.2,2.2,1.7),fat:safe(p.fatFactor,.5,1.3,.8)};s.weights=raw.weights.filter(x=>validDay(x.date)&&x.kg>=35&&x.kg<=300).map(x=>({date:x.date,kg:Number(x.kg)})).sort((a,b)=>a.date.localeCompare(b.date));for(const [date,v] of Object.entries(raw.logs)){if(!validDay(date))continue;let foods=Array.isArray(v.foods)?v.foods:[];s.diary[date]=foods.map(x=>({id:x.id||uid(),name:String(x.name||'Food'),quantity:100,calories:Number(x.calories||0),protein:Number(x.protein||0),carbs:Number(x.carbs||0),fat:Number(x.fat||0),fiber:0,sugar:0,sodium:0,meal:x.meal||'Lunch',estimated:!!x.estimated}));let tot=foods.reduce((a,f)=>{for(const k of ['calories','protein','carbs','fat'])a[k]+=Number(f[k]||0);return a},{calories:0,protein:0,carbs:0,fat:0});s.days[date]={...tot,steps:v.steps||null,complete:!!v.complete,notes:'Imported from older Metria diary totals; verify completeness.'};}s.plan.active=raw.plan?.activeTarget??null;s.plan.updated=validDay(raw.plan?.lastUpdated)?raw.plan.lastUpdated:localDay();s.status='ready';s.legacyHandled=true;state=s;if(state.plan.active==null)state.plan.active=engine().proposed;persist();toast('Previous Metria data imported. Review daily totals.')}catch(e){toast('Migration: '+e.message)}}
function readSupabaseConfig(){try{let p=JSON.parse(localStorage.getItem(PREF)||'null');return p?.url&&p?.key?p:null}catch(_){return null}}function saveSupabaseConfig(url,key){let u=new URL(url);if(u.protocol!=='https:'||!u.hostname.endsWith('.supabase.co')||u.username||u.password)throw Error('Use an HTTPS .supabase.co project URL.');if(!/^sb_publishable_[a-zA-Z0-9_-]+$/.test(key)&&!/^eyJ[a-zA-Z0-9_.-]+$/.test(key))throw Error('Use a publishable or legacy anon key, never a service-role key.');localStorage.setItem(PREF,JSON.stringify({url:u.origin,key}));cloud=null}
async function supabase(){let config=readSupabaseConfig();if(!config)throw Error('Configure a Supabase project in Settings first.');if(cloud)return cloud;let lib=await import('https://esm.sh/@supabase/supabase-js@2.49.8');cloud=lib.createClient(config.url,config.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const r=await cloud.auth.getUser();authed=r.data?.user||null;cloud.auth.onAuthStateChange((_evt,session)=>{authed=session?.user||null;if(authed)state.account='cloud';if(state.status==='ready'||state.status==='welcome')render()});return cloud}
async function emailSign(){const el=$('auth-email'),email=String(el?.value||'').trim();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))throw Error('Enter your valid email.');let sb=await supabase();let {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.href.split('#')[0]}});if(error)throw error;toast('Check your email for a sign-in link.');close()}
async function appleSign(){let sb=await supabase();let {error}=await sb.auth.signInWithOAuth({provider:'apple',options:{redirectTo:location.href.split('#')[0]}});if(error)throw error}
async function cloudUpload(){if(cloudBusy)return;cloudBusy=true;try{let sb=await supabase();let {data:{user},error:e}=await sb.auth.getUser();if(e||!user)throw Error('Sign in first.');let payload=JSON.parse(JSON.stringify({...state,account:'cloud'}));let {error}=await sb.from('metria_snapshots').upsert({user_id:user.id,payload,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)throw error;toast('Encrypted connection: cloud backup updated.')}catch(e){toast('Cloud upload failed: '+e.message)}finally{cloudBusy=false}}
async function cloudDownload(){if(cloudBusy)return;cloudBusy=true;try{let sb=await supabase();let {data:{user},error:e}=await sb.auth.getUser();if(e||!user)throw Error('Sign in first.');let {data,error}=await sb.from('metria_snapshots').select('payload,updated_at').eq('user_id',user.id).maybeSingle();if(error)throw error;if(!data)throw Error('No cloud backup exists yet.');if(!confirm('Replace local records with your cloud backup? Export local data first.'))return;state=sanitize(data.payload);state.status='ready';state.account='cloud';persist();toast('Cloud records restored.')}catch(e){toast('Cloud restore failed: '+e.message)}finally{cloudBusy=false}}
async function cloudDelete(){
 if(prompt('Type DELETE CLOUD to permanently delete your account cloud snapshot:')!=='DELETE CLOUD')return;
 try{let sb=await supabase(),{data:{user},error:authError}=await sb.auth.getUser();if(authError||!user)throw Error('Sign in required.');
  let {error}=await sb.from('metria_snapshots').delete().eq('user_id',user.id);if(error)throw error;
  state.ui.autoSync=false;save();render();toast('Cloud backup deleted. Local records and account remain.');
 }catch(e){toast('Cloud deletion failed: '+e.message)}
}
function scheduleSync(){if(!state.ui?.autoSync||!authed)return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>cloudUpload(),4000)}
async function signOut(){try{const sb=await supabase();let {error}=await sb.auth.signOut();if(error)throw error;authed=null;state.ui.autoSync=false;save();render();toast('Signed out. Local records preserved.')}catch(e){toast('Sign-out failed: '+e.message)}}
function approval(dismiss=false){let e=engine();if(!e.eligible)throw Error('Not enough evidence or not time for review.');if(!dismiss){if(!confirm(`Apply ${rnd(e.suggested)} kcal/day instead of ${rnd(e.active)}? This will be your new active target.`))return;state.plan.active=e.suggested;state.plan.updated=localDay();state.plan.history.push({date:localDay(),target:e.suggested})}state.plan.reviews.push({date:localDay(),kind:dismiss?'dismissed':'applied',proposed:e.suggested});persist();toast(dismiss?'Review postponed for seven days.':'New target approved.')}
function foodLibrary(kind){let foods=state.diary[selectedDay]||[];if(!foods.length)throw Error('Add food entries first.');let name=prompt(kind==='recipe'?'Name this recipe:':'Name this favorite meal:');if(!name?.trim())return;let entry={id:uid(),name:name.trim().slice(0,80),items:foods.map(f=>({...f})),type:kind};if(kind==='recipe')state.recipes.push(entry);else state.favorites.push(entry);persist();toast('Saved to your private food library.')}
function action(e){let target=e.target.closest('[data-route],[data-action],[data-modal],[data-theme],[data-goal],[data-period],[data-wheel],[data-wizgoal],[data-food-edit],[data-food-delete]');if(!target){if(e.target.id==='overlay')close();return;}if(target.dataset.route){route=target.dataset.route;if(state.status==='ready'){close();history.replaceState(null,'','#'+route);render()}return}if(target.dataset.modal){open(target.dataset.modal);return}if(target.dataset.theme){state.ui.theme=target.dataset.theme;persist();return}if(target.dataset.period){state.ui.stepsPeriod=Number(target.dataset.period)===30?30:7;persist();return}if(target.dataset.goal){let goal=target.dataset.goal;if(!['maintain','cut','gain'].includes(goal))return;if(!confirm('Change your objective and recalculate the active daily target?'))return;state.profile.goal=goal;state.plan.active=engine().proposed;state.plan.updated=localDay();state.plan.history.push({date:localDay(),target:state.plan.active});persist();toast('Goal changed. Active target recalculated.');return}if(target.dataset.wizgoal){onboardData.goal=target.dataset.wizgoal;let field=$('onboard-form')?.querySelector('input[name=goal]');if(field)field.value=target.dataset.wizgoal;target.parentElement.querySelectorAll('[data-wizgoal]').forEach(x=>x.classList.toggle('picked',x===target));return}if(target.dataset.wheel){selectWheel(target);return}if(target.dataset.foodEdit){open('food',{id:target.dataset.foodEdit});return}if(target.dataset.foodDelete){let id=target.dataset.foodDelete;let foods=state.diary[selectedDay]||[],food=foods.find(x=>x.id===id);if(!food)return;if(!confirm('Remove this optional diary entry?'))return;lastUndo={date:selectedDay,food:{...food}};state.diary[selectedDay]=foods.filter(x=>x.id!==id);persist();$('toastroot').innerHTML='<div class="toast" role="status">Food removed. <button class="btn tiny" data-action="undo-delete">Undo</button></div>';clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toastroot').innerHTML='',6500);return}
const a=target.dataset.action;try{if(a==='close'){close();return}if(a==='close-wheel'){wheelState=null;$('wheelroot').innerHTML='';return}if(a==='begin'||a==='guest'){state.status='wizard';onboard=0;onboardData={goal:'maintain',rate:'.25',sex:'unspecified',activity:'moderate'};persist();return}if(a==='wiz-back'){onboard=Math.max(0,onboard-1);render();return}if(a==='migrate'){migrateOld();return}if(a==='approve-adjustment'||a==='dismiss-adjustment'){approval(a==='dismiss-adjustment');return}if(a==='parse-meal'){let text=String($('meal-text')?.value||'');let parsed=parseMeal(text);if(!parsed.items.length&&!parsed.unknown.length)throw Error('Describe a meal with quantities.');open('review',parsed);return}if(a==='wheel-confirm'){let m=wheelState;if(!m)return;let w=$('pickerwheel');let i=clamp(Math.round(w.scrollTop/44),0,m.values.length-1);$('wheelroot').innerHTML='';wheelState=null;const input=$('n-'+m.field);if(input){input.value=m.values[i];input.dispatchEvent(new Event('input',{bubbles:true}))}return}if(a==='undo-delete'){if(!lastUndo)return;state.diary[lastUndo.date]=[...(state.diary[lastUndo.date]||[]),lastUndo.food];lastUndo=null;persist();toast('Food restored.');return}if(a==='copy-diary'){const yesterday=dateAdd(selectedDay,-1),src=state.diary[yesterday]||[];if(!src.length)throw Error('Yesterday has no optional diary foods.');if(!confirm(`Copy ${src.length} foods from yesterday to ${selectedDay}?`))return;state.diary[selectedDay]=[...(state.diary[selectedDay]||[]),...src.map(f=>({...f,id:uid()}))];persist();return}if(a==='favorite-meal'||a==='recipe-save'){foodLibrary(a==='recipe-save'?'recipe':'favorite');return}if(a==='use-library'){const item=[...state.favorites,...state.recipes].find(x=>x.id===target.dataset.id);if(!item)throw Error('Saved food not found');state.diary[selectedDay]=[...(state.diary[selectedDay]||[]),...(item.items||[]).map(f=>({...f,id:uid()}))];close();persist();toast('Foods added to optional diary.');return}
if(a==='export'){exportJSON();return}if(a==='csv'){exportCSV();return}if(a==='import'||a==='csv-import'){const input=document.createElement('input');input.type='file';input.accept=a==='import'?'application/json,.json':'.csv,text/csv';input.onchange=()=>importFile(input.files?.[0],a==='import'?'json':'csv');input.click();return}if(a==='reset'){if(prompt('Type DELETE to remove ALL local Metria data. This cannot be undone:')!=='DELETE'){toast('Cancelled.');return}let old=localStorage.getItem(OLD);localStorage.removeItem(KEY);state=clean();if(old)state.legacyHandled=false;route='home';persist();toast('Local Metria records cleared.');return}if(a==='save-cloud'){let url=String($('sb-url')?.value||'').trim(),key=String($('sb-key')?.value||'').trim();saveSupabaseConfig(url,key);close();render();toast('Public Supabase configuration saved.');return}if(a==='cloud-upload'){cloudUpload();return}if(a==='cloud-download'){cloudDownload();return}if(a==='cloud-delete'){cloudDelete();return}if(a==='signout'){signOut();return}if(a==='email-auth'){emailSign().catch(e=>toast('Email sign-in: '+e.message));return}if(a==='apple-auth'){appleSign().catch(e=>toast('Apple sign-in: '+e.message));return}if(a==='barcode'){open('barcode');return}if(a==='barcode-lookup'){lookupBarcode();return}if(a==='scan-camera'){scanBarcodeCamera();return}
}catch(error){toast(error.message||'Something went wrong.')}}
async function lookupBarcode(){let barcode=String($('barcode-number')?.value||'').replace(/\s/g,'');if(!/^\d{8,14}$/.test(barcode))throw Error('Enter an 8–14 digit EAN/UPC code.');toast('Looking up verified label data…');try{const controller=new AbortController,timeout=setTimeout(()=>controller.abort(),9000);const response=await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(barcode)}.json`,{signal:controller.signal});clearTimeout(timeout);if(!response.ok)throw Error('Food database unavailable.');let data=await response.json(),product=data.product;if(data.status!==1||!product)throw Error('Product not found. Enter it manually.');let n=product.nutriments||{},val=(k)=>Number(n[k+'_100g']);let kcal=val('energy-kcal');if(!Number.isFinite(kcal)){let kj=val('energy-kj');kcal=Number.isFinite(kj)?kj/4.184:null}if(!Number.isFinite(kcal)||kcal<0||kcal>1000)throw Error('No validated calorie data per 100g.');let item={id:uid(),name:String(product.product_name||'Scanned food').slice(0,90),quantity:100,calories:Math.round(kcal),protein:val('proteins')||0,carbs:val('carbohydrates')||0,fat:val('fat')||0,fiber:val('fiber')||0,sugar:val('sugars')||0,sodium:Math.round((val('sodium')||0)*1000),meal:'Lunch',estimated:false};close();open('review',{items:[item],unknown:[]});toast('Check the product label before saving.')}catch(e){toast('Barcode lookup: '+e.message)}}
async function scanBarcodeCamera(){if(!('BarcodeDetector'in window))throw Error('Camera barcode scanner is unavailable here. Enter the barcode manually.');if(!navigator.mediaDevices?.getUserMedia)throw Error('Camera access requires HTTPS and browser permission.');let stream=null,video=document.createElement('video');try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});video.srcObject=stream;video.setAttribute('playsinline','');await video.play();const detector=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});let found=null;for(let i=0;i<40;i++){let codes=await detector.detect(video);if(codes.length){found=codes[0].rawValue;break}await new Promise(r=>setTimeout(r,220))}if(!found)throw Error('No barcode found. Enter the number manually.');const input=$('barcode-number');if(input)input.value=found;toast('Barcode detected. Tap Look up.')}finally{stream?.getTracks().forEach(t=>t.stop());video.srcObject=null}}
// The food entry scanner is optional and requires active consent and a live network connection.
const originalOpen=open;open=function(type,data={}){if(type==='barcode'){sheet('Scan or enter barcode',`<p>Scan an EAN/UPC label if your browser supports it, or enter the digits. Data comes from Open Food Facts when you choose Look up.</p><div class="field"><label>EAN / UPC barcode</label><input id="barcode-number" inputmode="numeric" pattern="[0-9]*" maxlength="14" placeholder="e.g. 7310000000000"></div><div class="row wrap"><button class="btn primary" data-action="barcode-lookup">Look up product</button><button class="btn" data-action="scan-camera">${ico('scale')} Scan with camera</button></div><p class="tooltip">Label accuracy depends on the crowd-sourced product entry. Review nutritional information before saving. No barcode history is sent to Metria servers.</p>`);return}return originalOpen(type,data)};
function render(){theme();if(state.status==='welcome'){$('root').innerHTML=welcome();return}if(state.status==='wizard'){$('root').innerHTML=wizard();return}if(!state.profile){state.status='welcome';$('root').innerHTML=welcome();return}const map={home,trends,plan,diary,settings};if(!map[route])route='home';$('root').innerHTML=`<div class="shell">${nav()}<main class="main" id="main">${topbar()}${map[route]()}</main></div>`}
function onChange(e){if(e.target.id==='diary-date'&&validDay(e.target.value)&&e.target.value<=localDay()){selectedDay=e.target.value;render()}if(e.target.id==='autosync'){state.ui.autoSync=e.target.checked;persist();toast(e.target.checked?'Auto backup enabled.':'Auto backup disabled.')}}
function onInput(e){
 if(!modal||modal.kind!=='review'||!e.target.matches('[data-i][data-f=quantity]'))return;
 let index=Number(e.target.dataset.i),item=modal.items[index],quantity=Number(e.target.value);
 if(!item||!Number.isFinite(quantity)||quantity<0||quantity>2500)return;
 for(const key of ['calories','protein','carbs','fat','fiber','sugar','sodium']){
  let input=document.querySelector(`#sheetform [data-i="${index}"][data-f="${key}"]`);
  if(input)input.value=Number((item[key]*quantity/Math.max(1,item.quantity)).toFixed(key==='calories'||key==='sodium'?0:1));
 }
}
function onKey(e){if(e.key==='Escape'&&wheelState){wheelState=null;$('wheelroot').innerHTML='';return}if(e.key==='Escape'&&modal)close()}
document.addEventListener('click',action);document.addEventListener('submit',handleForm);document.addEventListener('change',onChange);document.addEventListener('input',onInput);document.addEventListener('keydown',onKey);window.addEventListener('hashchange',()=>{let hash=location.hash.slice(1);if(NAV.some(x=>x[0]===hash)&&state.status==='ready'){route=hash;render()}});let media=matchMedia('(prefers-color-scheme: dark)');media.addEventListener?.('change',()=>{if(state.ui.theme==='system')theme()});
state=load();if(state.status==='wizard'){onboard=0;onboardData={sex:'unspecified',goal:'maintain',rate:'.25',activity:'moderate'}}if(state.status==='ready'){let hash=location.hash.slice(1);if(NAV.some(x=>x[0]===hash))route=hash}render();
if(readSupabaseConfig()){supabase().then(()=>render()).catch(e=>console.warn('Optional Supabase unavailable:',e.message))}
if('serviceWorker'in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{}));
window.metriaDiagnostics=()=>({state:JSON.parse(JSON.stringify(state)),engine:state.profile?engine():null,calibration:state.profile?calibration():null,steps7:stepStats(7),steps30:stepStats(30)});
})();
