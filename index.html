function calibrate(){const base=baseline();const fail=(reason,extra={})=>({valid:false,reason,base:base?.value??null,...extra});if(!base?.value)return fail(base?.reason||'Complete your profile');if(state.profile.age<19)return fail('Growth makes adult-style weight-to-calorie calibration unreliable at ages 16–18. Track maintenance and consult a healthcare professional for intentional changes.');const w=weightEntries().filter(v=>v.date>=dateAdd(today(),-34));if(w.length<8)return fail(`Need 8 weigh-ins (currently ${w.length}).`,{weights:w.length});const first=w[0].date,last=w[w.length-1].date,span=diffDays(last,first);if(span<13)return fail(`Need at least 14 days between the first and last weigh-ins (currently ${span+1}).`,{weights:w.length});if(diffDays(today(),last)>4)return fail('Log a recent morning weight.');const logs=dayEntries().filter(r=>r.date>=first&&r.date<=last&&r.complete&&r.calories>0);let coverage=logs.length/(span+1);if(logs.length<11||coverage<.75)return fail(`Need more completed days (${logs.length}/${span+1} within the weight trend).`,{coverage,logged:logs.length});if(diffDays(today(),logs[logs.length-1].date)>5)return fail('Log your recent complete calorie intake.');let weightSlope=slope(w),intake=avg(logs.map(r=>r.calories));if(weightSlope==null)return fail('Weight trend not available.');if(Math.abs(weightSlope)>0.17)return fail('Rapid weight changes make this estimate unreliable.');const observed=intake-weightSlope*7700; // approximate energy balance only; not a physiological law
if(observed<base.value*.65||observed>base.value*1.4)return fail('Weight and intake signals disagree too strongly; continue tracking.');const s7=stepStats(7),s30=stepStats(30);if(s7.logged>=5&&s30.logged>=20&&s30.average&&Math.abs(s7.average/s30.average-1)>.25)return fail('Steps changed by over 25%; wait for activity to stabilize.');const weight=clamp(.2+(span-13)/60,.2,.48),blended=base.value*(1-weight)+observed*weight;return {valid:true,base:base.value,observed:Math.round(observed),value:round25(blended),intake:Math.round(intake),kgWeek:Math.round(weightSlope*7*100)/100,coverage:Math.round(coverage*100),weights:w.length,logged:logs.length,span,blend:weight}}
function plan(){const p=state.profile,b=baseline(),c=calibrate(),maintenance=c.valid?c.value:b?.value;const teen=p.age<19;const currentKg=latestWeight(),bmi=currentKg/(p.height/100)**2;const blocked=(teen||p.goal==='cut'&&bmi<20);let change=0;if(!blocked&&p.goal!=='maintain'&&maintenance){let rate=clamp(Number(p.rate||.25),.1,.75);if(p.targetDate&&p.targetWeight&&validDay(p.targetDate)){const left=diffDays(p.targetDate,today());if(left>=14){const needed=Math.abs((p.targetWeight-currentKg)/(left/7))/Math.max(currentKg,1)*100;rate=Math.min(rate,needed)}}let nominal=currentKg*rate/100*7700/7;change=p.goal==='cut'?-Math.min(nominal,Math.min(450,maintenance*.18)):Math.min(nominal,Math.min(300,maintenance*.12))}
const target=maintenance?round25(clamp(maintenance+change,Math.max(1200,maintenance*.78),6000)):null;
let active=Number.isFinite(+state.plan.active)&&state.plan.active!==null?+state.plan.active:target;
// If a later age/weight change activates a safety hold, never display a prior deficit as an active prescription.
if(blocked&&target!==null&&active!==null&&active<target)active=target;
const diff=target!==null&&active!==null?target-active:0;
const eligible=!!c.valid&&!blocked&&Math.abs(diff)>=75&&(!state.plan.lastReview||diffDays(today(),state.plan.lastReview)>=7)&&(!state.plan.changedAt||diffDays(today(),state.plan.changedAt)>=7);
const suggested=eligible?round25(active+clamp(diff,-100,100)):null;

function macroTargets(kcal){if(!state.profile||!kcal)return null;let weight=latestWeight(),protein=Math.round(weight*(state.profile.proteinFactor||1.6)),fat=Math.round(weight*(state.profile.fatFactor||.8)),carbs=Math.max(0,Math.round((kcal-protein*4-fat*9)/4));return {protein,fat,carbs}}
function ratio(a,b){return !a||!b?0:Math.min(100,Math.max(0,a/b*100))}

function wheel(name,label,min,max,step,value,units){const n=Number(value),list=[];const count=Math.round((max-min)/step);for(let i=0;i<=count;i++){let v=Number((min+i*step).toFixed(3)),display=step<1?v.toFixed(1):v.toFixed(0);list.push(`<button type="button" class="wheel-option ${Math.abs(v-n)<step/2?'active':''}" data-action="wheel-pick" data-field="${esc(name)}" data-value="${v}" data-index="${i}" aria-label="Select ${display} ${esc(units)}">${display}</button>`)}return `<div class="wheel-block" data-wheel="${esc(name)}" data-min="${min}" data-max="${max}" data-step="${step}"><div class="wheel-title">${esc(label)}</div><div class="wheel-ui"><div class="wheel-window" data-wheel-scroll="${esc(name)}" tabindex="0" aria-label="${esc(label)} wheel"><div class="wheel-pad"></div>${list.join('')}<div class="wheel-pad"></div></div><div class="wheel-right"><label class="tiny muted" for="num-${esc(name)}">${esc(units)}</label><input id="num-${esc(name)}" name="${esc(name)}" type="number" inputmode="decimal" min="${min}" max="${max}" step="${step===1?'1':'0.1'}" value="${Number.isFinite(n)?n:min}" aria-label="${esc(label)} numeric entry"><div class="wheel-step"><button type="button" data-action="wheel-step" data-field="${esc(name)}" data-delta="-1" class="btn sm" aria-label="Decrease ${esc(label)}">−</button><button type="button" data-action="wheel-step" data-field="${esc(name)}" data-delta="1" class="btn sm" aria-label="Increase ${esc(label)}">+</button></div></div></div></div>`}

')}</button></div></div>`}

function initializeWheels(){document.querySelectorAll('[data-wheel-scroll]').forEach(el=>{const root=el.closest('[data-wheel]'),name=root.dataset.wheel,min=+root.dataset.min,step=+root.dataset.step,inp=root.querySelector('input');let current=+inp.value;if(!Number.isFinite(current))current=min;const index=Math.round((current-min)/step);el.scrollTop=index*42;el.addEventListener('pointerdown',()=>{root.dataset.manualInput='false'});el.addEventListener('touchstart',()=>{root.dataset.manualInput='false'},{passive:true});el.addEventListener('scroll',()=>{if(root.dataset.manualInput==='true')return;clearTimeout(wheelTimers[name]);wheelTimers[name]=setTimeout(()=>{if(!el.isConnected||root.dataset.manualInput==='true')return;const index=clamp(Math.round(el.scrollTop/42),0,el.querySelectorAll('.wheel-option').length-1);const target=el.querySelectorAll('.wheel-option')[index];if(target)updateWheel(name,+target.dataset.value,false)},130)},{passive:true})})}

function handleClick(event){let t=event.target.closest('[data-action]');if(!t)return;if(t.dataset.action==='overlay'&&event.target!==t)return;event.preventDefault();const a=t.dataset.action;try{

}catch(e){flash(e.message||'Something went wrong.');console.error(e)}}
function saveForm(event){if(!event.target.matches('form'))return;event.preventDefault();const form=event.target,values=getForm(form);try{
if(form.id==='wizard-form'){validateWizard(state.setupStep,values);if(state.setupStep>=STEPS.length-1)finishWizard();else{state.setupStep++;commit()}return}
if(form.id==='daily-form'){const d=values.date;if(!validDay(d)||d>today())throw Error('Choose a valid date.');const calories=parseNumber(values.calories,0,15000,'Calories'),protein=values.protein?parseNumber(values.protein,0,1000,'Protein'):0,carbs=values.carbs?parseNumber(values.carbs,0,1500,'Carbs'):0,fat=values.fat?parseNumber(values.fat,0,1000,'Fat'):0,steps=values.steps===''?null:parseNumber(values.steps,0,100000,'Steps'),complete=!!form.elements.complete.checked;if(complete&&!calories)throw Error('Completed days need full daily intake.');const macro=protein*4+carbs*4+fat*9;if(complete&&macro&&Math.abs(macro-calories)>Math.max(350,calories*.25)&&!confirm('Macro calories differ substantially from total calories. Save anyway?'))return;state.days[d]={calories,protein,carbs,fat,steps,complete,notes:values.notes||''};closeSheet();commit();flash('Daily totals saved.');return}
if(form.id==='steps-form'){const d=values.date;if(!validDay(d)||d>today())throw Error('Invalid steps date.');const steps=parseNumber(values.steps,0,100000,'Steps');state.days[d]={...(state.days[d]||{}),steps};closeSheet();commit();flash('Steps saved.');return}
if(form.id==='weight-form'){const d=values.date;if(!validDay(d)||d>today())throw Error('Invalid weight date.');state.weights[d]=parseNumber(values.weight,35,200,'Weight');closeSheet();commit();flash('Weight saved.');return}
if(form.id==='profile-form'){let p=state.profile;p.name=String(values.name||'').slice(0,45);p.age=parseNumber(values.age,16,100,'Age');p.height=parseNumber(values.height,130,230,'Height');p.weight=parseNumber(values.weight,35,200,'Weight');p.sex=values.sex||'unspecified';closeSheet();commit();flash('Profile updated.');return}
if(form.id==='goal-form'){let p=state.profile;p.activity=values.activity;p.goal=values.goal;p.rate=p.age<19?p.rate:Number(values.rate||p.rate);p.targetWeight=values.targetWeight?parseNumber(values.targetWeight,35,250,'Goal weight'):null;p.targetDate=validDay(values.targetDate)&&values.targetDate>=dateAdd(today(),14)?values.targetDate:'';p.manual=values.manual?parseNumber(values.manual,1000,6000,'Starting estimate'):null;closeSheet();commit();flash('Plan preferences updated.');return}
if(form.id==='target-form'){let newTarget=parseNumber(values.active,1200,6000,'Target');let e=plan();if(e.teen&&e.maintenance&&newTarget<e.maintenance*.97)throw Error('For ages 16–18, use maintenance tracking rather than a deficit target.');if(!confirm(`Set active calorie target to ${fmt(newTarget)} kcal/day?`))return;state.plan.active=round25(newTarget);state.plan.changedAt=today();state.plan.history.push({date:today(),target:round25(newTarget),reason:'Manual target'});closeSheet();commit();flash('Target updated.');return}
if(form.id==='macro-form'){state.profile.proteinFactor=parseNumber(values.proteinFactor,.8,2.5,'Protein factor');state.profile.fatFactor=parseNumber(values.fatFactor,.5,1.5,'Fat factor');closeSheet();commit();flash('Macros updated.');return}
if(form.id==='food-form'){const o={id:sheet?.id||id(),name:String(values.name||'').trim().slice(0,80),calories:parseNumber(values.calories,0,8000,'Food calories')};if(!o.name)throw Error('Enter a food name.');for(const [key,limit] of [['protein',500],['carbs',800],['fat',500],['fiber',150],['sugar',800],['sodium',15000]])o[key]=parseNumber(values[key]||'0',0,limit,key);let foods=state.diary[chosenDay]||[];state.diary[chosenDay]=sheet.id?foods.map(f=>f.id===sheet.id?o:f):[...foods,o];if(form.elements.favorite.checked&&!state.favorites.some(f=>f.name===o.name&&f.calories===o.calories))state.favorites.push({...o,id:id()});closeSheet();commit();flash('Food saved in optional diary.');return}
}catch(e){flash(e.message||'Could not save.');console.error(e)}}
function download(name,contents,mime){const blob=new Blob([contents],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function csvEscape(v){const s=String(v??'');return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function exportCSV(){let headers=['date','calories','protein','carbs','fat','steps','complete','weight_kg','notes'],dates=[...new Set([...Object.keys(state.days),...Object.keys(state.weights)])].sort();let rows=[headers.join(',')];for(const date of dates){let d=state.days[date]||{},r=[date,d.calories??'',d.protein??'',d.carbs??'',d.fat??'',d.steps??'',d.complete?'true':'false',state.weights[date]??'',d.notes||''];rows.push(r.map(csvEscape).join(','))}download('Macro-daily-history-'+today()+'.csv',rows.join('\r\n'),'text/csv;charset=utf-8')}
function parseCSV(s){let rows=[],r=[],q='',quoted=false;for(let i=0;i<s.length;i++){const c=s[i];if(c==='"'){if(quoted&&s[i+1]==='"'){q+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){r.push(q);q=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&s[i+1]==='\n')i++;r.push(q);rows.push(r);r=[];q=''}else q+=c}if(q||r.length){r.push(q);rows.push(r)}return rows}
async function importFile(file,type){try{const text=await file.text();if(type==='json'){const obj=JSON.parse(text);if(![1,3].includes(obj.schema)||!obj.profile&&!obj.status)throw Error('Not a compatible Macro or Metria backup.');if(obj.schema===3){if(!confirm('Import an earlier Metria backup? Macro will convert its profile and logs. Your original file remains unchanged.'))return;state=convertLegacy(obj);save();render();flash('Earlier Metria backup imported.');return;}if(!confirm('Restore this backup? It will replace current local records. Export a backup first.'))return;state={...emptyState(),...obj,settings:{...emptyState().settings,...obj.settings},plan:{...emptyState().plan,...obj.plan}};state.status=state.profile?'ready':'welcome';save();render();flash('Backup restored.');return}const rows=parseCSV(text.replace(/^\uFEFF/,''));if(rows.length<2)throw Error('No data rows in CSV.');const head=rows[0].map(x=>x.trim().toLowerCase()),find=(r,key)=>r[head.indexOf(key)]??'';if(!head.includes('date'))throw Error('CSV requires a date column.');if(!confirm('Merge this CSV into local daily and weight records? Existing dates may be replaced.'))return;let count=0;for(const r of rows.slice(1)){const date=find(r,'date');if(!validDay(date)||date>today())continue;let day=state.days[date]||{},changed=false;for(const key of ['calories','protein','carbs','fat','steps']){const s=find(r,key);if(s!==''){let num=Number(s);if(!Number.isFinite(num)||num<0)continue;day[key]=num;changed=true}}if(find(r,'complete')!==''){day.complete=/^(true|1|yes)$/i.test(find(r,'complete'));changed=true}if(find(r,'notes')){day.notes=find(r,'notes').slice(0,250);changed=true}const weight=find(r,'weight_kg')||find(r,'weight');if(weight&&Number(weight)>=35&&Number(weight)<=200){state.weights[date]=Number(weight);changed=true}if(changed){state.days[date]=day;count++}}if(!count)throw Error('CSV contained no valid daily records.');commit();flash(`Imported ${count} daily records.`)}catch(e){flash('Import: '+e.message)}}
function convertLegacy(old){let next=emptyState(),p=old.profile;if(!p)throw Error('No compatible personal profile found.');next.profile={name:String(p.name||''),age:clamp(Number(p.age)||18,16,100),height:clamp(Number(p.height)||175,130,230),weight:clamp(Number(p.weight)||70,35,200),sex:['male','female','unspecified'].includes(p.sex)?p.sex:'unspecified',activity:p.activity||'moderate',goal:p.goal||'maintain',rate:Number(p.rate||.25),targetWeight:p.targetWeight||null,targetDate:p.targetDate||'',manual:p.manual??p.manualMaintenance??null,proteinFactor:Number(p.protein||p.proteinFactor||1.6),fatFactor:Number(p.fat||p.fatFactor||.8)};
if(old.schema===3){for(const [date,r] of Object.entries(old.days||{})){if(validDay(date))next.days[date]={calories:+r.calories||0,protein:+r.protein||0,carbs:+r.carbs||0,fat:+r.fat||0,steps:r.steps==null?null:+r.steps,complete:!!r.complete,notes:r.notes||''}}for(const w of old.weights||[]){if(validDay(w.date)&&w.kg>=35&&w.kg<=200)next.weights[w.date]=+w.kg}next.diary=old.diary&&typeof old.diary==='object'?old.diary:{};next.favorites=Array.isArray(old.favorites)?old.favorites:[];next.plan.active=Number.isFinite(Number(old.plan?.active))&&old.plan?.active!=null?Number(old.plan.active):null;next.plan.changedAt=old.plan?.updated||null;next.settings.theme=['system','light','dark'].includes(old.ui?.theme)?old.ui.theme:'system'}else{for(const [date,r] of Object.entries(old.logs||{})){if(!validDay(date))continue;next.days[date]={calories:+r.calories||0,protein:+r.protein||0,carbs:+r.carbs||0,fat:+r.fat||0,steps:r.steps??null,complete:!!r.complete}}for(const w of old.weights||[]){if(validDay(w.date)&&w.kg>=35&&w.kg<=200)next.weights[w.date]=+w.kg}}
next.status='ready';next.migrated=true;return next}
function migrateLegacy(){let s=tryRead(OLD_V6),old=null;if(s){try{old=JSON.parse(s)}catch{}}if(!old?.profile){try{let o=JSON.parse(tryRead(OLD_V5)||'null');if(o?.mode==='personal'&&o.profile)old=o}catch{}}if(!old?.profile){flash('No compatible previous personal profile found.');return}if(!confirm('Import your earlier personal data into Macro? Export any Macro entries first. The old data will remain untouched.'))return;state=convertLegacy(old);page='home';commit();flash('Previous personal data imported. Review it in Settings.');}

function handleChange(e){const t=e.target;if(t.id==='diary-date'){if(validDay(t.value)&&t.value<=today()){chosenDay=t.value;render()}return}if(t.matches('[data-wheel] input')){const root=t.closest('[data-wheel]');if(root.dataset.manualInput==='true')return;if(t.value!==''&&Number.isFinite(+t.value))updateWheel(root.dataset.wheel,+t.value,true);return}}
function handleInput(e){const t=e.target;if(t.matches('[data-wheel] input')){const root=t.closest('[data-wheel]');if(t.value==='')return;let v=Number(t.value);if(Number.isFinite(v)&&v>=+root.dataset.min&&v<=+root.dataset.max){root.dataset.manualInput='true';const track=root.querySelector('[data-wheel-scroll]'),index=Math.round((v-(+root.dataset.min))/(+root.dataset.step));track.scrollTop=index*42;root.querySelectorAll('.wheel-option').forEach(x=>x.classList.toggle('active',+x.dataset.index===index));if(state.status==='setup')draft[root.dataset.wheel]=v}}}
function handleKey(e){if(e.key==='Escape'&&sheet){closeSheet()}}
document.addEventListener('click',handleClick);document.addEventListener('submit',saveForm);document.addEventListener('change',handleChange);document.addEventListener('input',handleInput);document.addEventListener('keydown',handleKey);
state=load();draft={age:18,height:175,weight:70,sex:'',activity:'moderate',goal:'maintain',rate:.25};if(state.status==='setup'&&state.profile)state.status='ready';if(state.status==='setup')state.setupStep=0;render();if(window.matchMedia){window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(state.settings.theme==='system')theme()})}
if('serviceWorker'in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{}));
window.macroDiagnostics=()=>({state:structuredClone(state),plan:state.profile?plan():null,step7:stepStats(7),step30:stepStats(30)});
})();
